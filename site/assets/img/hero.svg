<svg xmlns="http://www.w3.org/2000/svg" class="gi gi-hero" viewBox="0 0 960 420" width="960" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A question travels through data, retrieval, model, tools, agents and evaluation stations to an answer">
<title>A question travels through data, retrieval, model, tools, agents and evaluation stations to an answer</title>
<defs><style>.gi-hero{--h-t:var(--text,#141a2e);--h-t2:var(--text-2,#444d6b);--h-s:var(--surface,#fff);--h-s3:var(--surface-3,#e4e8f4);--h-bd:var(--border,#d9deec);--h-bd2:var(--border-strong,#b9c1da);--h-ok:var(--ok,#15803d);--h-1:var(--brand-1,#6d5efc);--h-2:var(--brand-2,#22d3ee)}@media (prefers-color-scheme:dark){.gi-hero{--h-t:var(--text,#e9edfb);--h-t2:var(--text-2,#b7bfdc);--h-s:var(--surface,#121a33);--h-s3:var(--surface-3,#212d5c);--h-bd:var(--border,#27335f);--h-bd2:var(--border-strong,#3a4880);--h-ok:var(--ok,#4ade80)}}.fh-s1{stop-color:var(--h-1)}.fh-s2{stop-color:var(--h-2)}.fh-pp{fill:none;stroke-linecap:round}.fh-p0{stroke:var(--h-s3)}.fh-p1{stroke:var(--h-s)}.fh-orb{fill:none;stroke:var(--h-bd);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1 9}.fh-st{fill:var(--h-s);stroke:var(--h-bd);stroke-width:1.5}.fh-ic{fill:none;stroke:var(--h-t);stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.fh-lab{font:650 20px var(--font-sans,system-ui,sans-serif);fill:var(--h-t2);text-anchor:middle}@media (prefers-reduced-motion:no-preference){.fh-flow{animation:fh-dash 1.8s linear infinite}.fh-halo{animation:fh-halo 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}}@keyframes fh-dash{to{stroke-dashoffset:-20}}@keyframes fh-halo{50%{opacity:.55;transform:scale(1.08)}}</style>
